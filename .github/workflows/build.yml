name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DocumentProcessor.sln

      - name: Build
        run: dotnet build DocumentProcessor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DocumentProcessor.sln --configuration Release --no-build